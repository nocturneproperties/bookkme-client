name: Mobile bug
description: Something is broken in the Android or iOS app.
labels: ["bug", "mobile"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.4.0 (build 120)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Android 15, iOS 18.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Pixel 8, iPhone 15 Pro, emulator
  - type: dropdown
    id: variant
    attributes:
      label: Build variant
      options:
        - prod
        - dev
        - mock
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logcat, Xcode console or crash report. Remove tokens and personal data first.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
