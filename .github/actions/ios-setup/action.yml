name: iOS Setup
description: Prepares a macOS runner to build the iOS app (Java, Gradle, Kotlin/Native, SPM and Xcode compilation caches, Firebase config, build version, signing)

inputs:
  gradle-encryption-key:
    description: Gradle configuration cache encryption key
    required: true
  write-caches:
    description: >-
      Only the iOS Cache Warm-up workflow sets this to "true". It saves the Gradle cache and starts the Kotlin/Native
      library caches and the Xcode compilation cache empty, so that ios-cache-save stores only what this build used.
      Every other job restores those caches read-only.
    required: false
    default: "false"
  environment:
    description: App variant being built (Dev or Prod); selects the Firebase config folder
    required: true
  google-service-info:
    description: Base64-encoded GoogleService-Info.plist of the selected environment
    required: true
  signing-certificate:
    description: Base64-encoded .p12 signing certificate; signing is skipped when empty
    required: false
    default: ""
  signing-certificate-password:
    description: Password of the .p12 signing certificate
    required: false
    default: ""
  provisioning-profile:
    description: Base64-encoded .mobileprovision profile
    required: false
    default: ""
  distribution-certificate:
    description: Base64-encoded .p12 Apple Distribution certificate used to re-sign the archive on export
    required: false
    default: ""
  distribution-certificate-password:
    description: Password of the .p12 Apple Distribution certificate
    required: false
    default: ""
  distribution-provisioning-profile:
    description: Base64-encoded App Store .mobileprovision profile
    required: false
    default: ""

outputs:
  konan-toolchain-key:
    description: Cache key of the Kotlin/Native toolchain
    value: ${{ steps.cache-keys.outputs.konan-toolchain }}
  konan-toolchain-hit:
    description: Whether the Kotlin/Native toolchain was restored from an exact key match
    value: ${{ steps.konan-toolchain.outputs.cache-hit }}
  konan-caches-key:
    description: Cache key of the Kotlin/Native library caches
    value: ${{ steps.cache-keys.outputs.konan-caches }}
  spm-key:
    description: Cache key of the Swift package checkouts
    value: ${{ steps.cache-keys.outputs.spm }}
  spm-hit:
    description: Whether the Swift package checkouts were restored from an exact key match
    value: ${{ steps.spm.outputs.cache-hit }}
  xcode-cas-key:
    description: Cache key of the Xcode compilation cache
    value: ${{ steps.cache-keys.outputs.xcode-cas }}

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Resolve Cache Keys
      id: cache-keys
      shell: bash
      env:
        LIBS_HASH: ${{ hashFiles('gradle/libs.versions.toml') }}
        PACKAGES_HASH: ${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      run: |
        kotlin_version=$(sed -nE 's/^kotlin = "(.+)"$/\1/p' gradle/libs.versions.toml)
        if [ -z "$kotlin_version" ]; then
          echo "::error::Kotlin version not found in gradle/libs.versions.toml"
          exit 1
        fi
        xcode_version=$(xcodebuild -version | sed -nE 's/^Xcode (.+)$/\1/p')
        platform="$RUNNER_OS-$RUNNER_ARCH"
        {
          echo "konan-toolchain=konan-toolchain-$platform-$kotlin_version"
          echo "konan-caches-prefix=konan-caches-$platform-$kotlin_version-"
          echo "konan-caches=konan-caches-$platform-$kotlin_version-$LIBS_HASH"
          echo "spm-prefix=spm-$platform-"
          echo "spm=spm-$platform-$PACKAGES_HASH"
          echo "xcode-cas-prefix=xcode-cas-$platform-$xcode_version-"
          echo "xcode-cas=xcode-cas-$platform-$xcode_version-$GITHUB_SHA"
        } >> "$GITHUB_OUTPUT"
        {
          echo "GRADLE_BUILD_ACTION_CACHE_KEY_JOB=ios"
          echo "GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE=ios"
        } >> "$GITHUB_ENV"

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}
        cache-read-only: ${{ inputs.write-caches != 'true' }}

    - name: Restore Kotlin/Native Toolchain
      id: konan-toolchain
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.konan/dependencies
          ~/.konan/kotlin-native-prebuilt-*
          !~/.konan/kotlin-native-prebuilt-*/klib/cache
        key: ${{ steps.cache-keys.outputs.konan-toolchain }}

    - name: Restore Kotlin/Native Library Caches
      if: inputs.write-caches != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.konan/kotlin-native-prebuilt-*/klib/cache
        key: ${{ steps.cache-keys.outputs.konan-caches }}
        restore-keys: ${{ steps.cache-keys.outputs.konan-caches-prefix }}

    - name: Restore Swift Packages
      id: spm
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/DerivedData/SourcePackages
        key: ${{ steps.cache-keys.outputs.spm }}
        restore-keys: ${{ steps.cache-keys.outputs.spm-prefix }}

    - name: Restore Xcode Compilation Cache
      if: inputs.write-caches != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/DerivedData/CompilationCache.noindex
        key: ${{ steps.cache-keys.outputs.xcode-cas }}
        restore-keys: ${{ steps.cache-keys.outputs.xcode-cas-prefix }}

    - name: Import Firebase Config
      shell: bash
      env:
        GOOGLE_SERVICE_INFO: ${{ inputs.google-service-info }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ -z "$GOOGLE_SERVICE_INFO" ]; then
          echo "::error::GoogleService-Info.plist secret for $ENVIRONMENT is empty or missing"
          exit 1
        fi
        mkdir -p "iosApp/iosApp/Firebase/$ENVIRONMENT"
        echo -n "$GOOGLE_SERVICE_INFO" | base64 --decode > "iosApp/iosApp/Firebase/$ENVIRONMENT/GoogleService-Info.plist"

    - name: Apply Build Version
      shell: bash
      run: |
        plist=iosApp/iosApp/Info.plist
        if [ -n "$BUILD_VERSION_CODE" ]; then
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VERSION_CODE" "$plist"
        fi
        if [ -n "$BUILD_VERSION" ]; then
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BUILD_VERSION" "$plist"
        fi

    - name: Import Signing Identity
      if: inputs.signing-certificate != ''
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.signing-certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.signing-certificate-password }}
        PROVISIONING_PROFILE: ${{ inputs.provisioning-profile }}
        DISTRIBUTION_CERTIFICATE: ${{ inputs.distribution-certificate }}
        DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ inputs.distribution-certificate-password }}
        DISTRIBUTION_PROVISIONING_PROFILE: ${{ inputs.distribution-provisioning-profile }}
      run: |
        keychain_path="$RUNNER_TEMP/signing.keychain-db"
        keychain_password=$(uuidgen)
        profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

        security create-keychain -p "$keychain_password" "$keychain_path"
        security set-keychain-settings -lut 21600 "$keychain_path"
        security unlock-keychain -p "$keychain_password" "$keychain_path"
        mkdir -p "$profiles_dir"

        import_identity() {
          local name=$1 certificate=$2 certificate_password=$3 profile=$4
          local certificate_path="$RUNNER_TEMP/$name.p12"
          local profile_path="$RUNNER_TEMP/$name.mobileprovision"

          echo -n "$certificate" | base64 --decode > "$certificate_path"
          echo -n "$profile" | base64 --decode > "$profile_path"

          security import "$certificate_path" -P "$certificate_password" -A -t cert -f pkcs12 -k "$keychain_path"
          local profile_uuid=$(security cms -D -i "$profile_path" | plutil -extract UUID raw -)
          cp "$profile_path" "$profiles_dir/$profile_uuid.mobileprovision"
        }

        import_identity development "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$PROVISIONING_PROFILE"
        if [ -n "$DISTRIBUTION_CERTIFICATE" ]; then
          import_identity distribution "$DISTRIBUTION_CERTIFICATE" "$DISTRIBUTION_CERTIFICATE_PASSWORD" "$DISTRIBUTION_PROVISIONING_PROFILE"
        fi

        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
        security list-keychains -d user -s "$keychain_path"
