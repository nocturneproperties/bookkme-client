name: Site Image
description: Builds the site container image from the exported site/.kobweb and pushes it to GHCR

inputs:
  tag:
    description: Image tag to publish
    required: true
  registry-token:
    description: Token allowed to write packages to ghcr.io
    required: true

runs:
  using: composite
  steps:
    - name: Publish Image
      shell: bash
      env:
        IMAGE: ghcr.io/nocturneproperties/bookkme-site:${{ inputs.tag }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        echo -n "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        docker build --tag "$IMAGE" site
        docker push "$IMAGE"
        echo "Published \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
