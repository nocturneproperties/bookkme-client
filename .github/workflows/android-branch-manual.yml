name: Android Manual Distribute

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Distribution environment"
        required: true
        type: choice
        options: [ Dev, Prod ]
        default: Dev
      cache:
        description: "Use latest artifact"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: android-manual-${{ github.ref }}-${{ inputs.environment }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - name: Set dynamic variables
        run: |
          version_code=$(date +%y%j%H%M)
          clean_ref=${GITHUB_REF_NAME//\//_}
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "BUILD_VERSION=${GITHUB_REF_NAME##*-v}" >> $GITHUB_ENV
          fi
          env_name=${{ inputs.environment }}
          echo "CLEAN_REF=${clean_ref}" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=$version_code" >> $GITHUB_ENV
          echo "ENV_NAME=${env_name,,}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Setup Android
        uses: ./.github/actions/android-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-cache-read-only: "false"
          keystore-properties: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          debug-keystore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_FILE }}
          release-keystore: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE }}
          google-services: ${{ secrets.ANDROID_GOOGLE_SERVICES_FILE }}

      - name: Find Latest Artifact
        id: latest
        if: inputs.cache
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: android-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          echo "run-id=$run_id" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        id: download
        if: steps.latest.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
          path: androidApp/build/outputs/apk/${{ env.ENV_NAME }}/release
          run-id: ${{ steps.latest.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Assemble
        id: assemble
        if: steps.download.outcome != 'success'
        run: ./gradlew assemble${{ inputs.environment }}Release

      - name: Upload artifact
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
          path: androidApp/build/outputs/apk/${{ env.ENV_NAME }}/release/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 5

      - name: Distribute
        env:
          SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICEACC_FILE }}
        run: |
          credentials_path="$RUNNER_TEMP/serviceaccount.json"
          echo -n "$SERVICE_ACCOUNT" | base64 --decode > "$credentials_path"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials_path" ./gradlew appDistributionUpload${{ inputs.environment }}Release
