name: Android Release
on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - name: Set dynamic variables
        run: |
          tag_name=${GITHUB_REF#refs/tags/}
          version_code=$(date +%y%j%H%M)
          echo "BUILD_VERSION_CODE=$version_code" >> $GITHUB_ENV
          echo "BUILD_VERSION=${tag_name##*-v}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Setup Android
        uses: ./.github/actions/android-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          keystore-properties: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          debug-keystore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_FILE }}
          release-keystore: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE }}
          google-services: ${{ secrets.ANDROID_GOOGLE_SERVICES_FILE }}

      - name: Build
        run: ./gradlew assembleProdRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-prod-release
          path: androidApp/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 5
