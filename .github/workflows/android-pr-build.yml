name: Android Pull Request Verification
on:
  pull_request:
    branches: [ development ]
    types: [ edited, synchronize, ready_for_review ]

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.0'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Import Secrets
        run: |
          echo -n "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > $GITHUB_WORKSPACE/androidApp/keystore.properties
          echo -n "${{ secrets.ANDROID_SERVICEACC_FILE }}" | base64 --decode > $GITHUB_WORKSPACE/androidApp/serviceaccount.json
          mkdir -p $GITHUB_WORKSPACE/androidApp/keystore
          echo -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_FILE }}" | base64 --decode > $GITHUB_WORKSPACE/androidApp/keystore/debug.jks
          echo -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE }}" | base64 --decode > $GITHUB_WORKSPACE/androidApp/keystore/release.jks
          echo -n "${{ secrets.ANDROID_GOOGLE_SERVICES_FILE }}" | base64 --decode > $GITHUB_WORKSPACE/androidApp/google-services.json

      - name: Build
        run: |
          ./gradlew assembleDevDebug