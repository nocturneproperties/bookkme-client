name: Client Release
on:
  push:
    tags:
      - 'client-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: client-release-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - name: Set dynamic variables
        run: |
          tag_name=${GITHUB_REF#refs/tags/}
          echo "BUILD_VERSION=${tag_name##*-v}" >> $GITHUB_ENV
          echo "CLEAN_REF=${tag_name//\//_}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Setup Android
        uses: ./.github/actions/android-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-key-job: client
          keystore-properties: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          debug-keystore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_FILE }}
          google-services: ${{ secrets.ANDROID_GOOGLE_SERVICES_FILE }}

      - name: Export
        uses: ./.github/actions/kobweb-export
        with:
          app: client
          flavor: prodRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ env.CLEAN_REF }}
          path: |
            apps/client/.kobweb/conf.yaml
            apps/client/.kobweb/server/server.jar
            apps/client/.kobweb/site
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 5

      - name: Publish
        uses: ./.github/actions/kobweb-image
        with:
          app: client
          image: bookkme-webapp
          tag: ${{ env.BUILD_VERSION }}
          registry-token: ${{ github.token }}
