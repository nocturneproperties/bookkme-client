name: iOS Manual TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Distribution environment"
        required: true
        type: choice
        options: [ Dev, Prod ]
        default: Dev
      cache:
        description: "Use latest artifact"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: macos-26
    concurrency:
      group: ios-manual-${{ github.ref }}-${{ inputs.environment }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - name: Set dynamic variables
        run: |
          version_code=$(date +%y%j%H%M)
          clean_ref=${GITHUB_REF#refs/heads/}
          clean_ref=${clean_ref//\//_}
          env_name=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          echo "CLEAN_REF=${clean_ref}" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=$version_code" >> $GITHUB_ENV
          echo "ENV_NAME=${env_name}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Setup iOS
        uses: ./.github/actions/ios-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          environment: ${{ inputs.environment }}
          gradle-cache-read-only: "false"
          google-service-info: ${{ inputs.environment == 'Dev' && secrets.IOS_DEV_GOOGLE_SERVICE_INFO_FILE || secrets.IOS_GOOGLE_SERVICE_INFO_FILE }}
          signing-certificate: ${{ secrets.IOS_CERTIFICATE_FILE }}
          signing-certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          provisioning-profile: ${{ inputs.environment == 'Dev' && secrets.IOS_DEV_PROVISIONING_PROFILE_FILE || secrets.IOS_PROVISIONING_PROFILE_FILE }}
          distribution-certificate: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_FILE }}
          distribution-certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          distribution-provisioning-profile: ${{ inputs.environment == 'Dev' && secrets.IOS_DEV_APPSTORE_PROVISIONING_PROFILE_FILE || secrets.IOS_APPSTORE_PROVISIONING_PROFILE_FILE }}

      - name: Find Latest Artifact
        id: latest
        if: inputs.cache
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ios-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          echo "run-id=$run_id" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        id: download
        if: steps.latest.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
          path: ${{ runner.temp }}/export
          run-id: ${{ steps.latest.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Archive
        id: archive
        if: steps.download.outcome != 'success'
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme ${{ env.ENV_NAME }} \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            -archivePath ${{ runner.temp }}/BookkMe.xcarchive
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/BookkMe.xcarchive \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath ${{ runner.temp }}/export

      - name: Upload artifact
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          overwrite: true
          retention-days: 5

      - name: Upload to TestFlight
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_FILE }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          keys_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys_dir"
          echo -n "$API_KEY" | base64 --decode > "$keys_dir/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-package ${{ runner.temp }}/export/*.ipa \
            --api-key "$API_KEY_ID" \
            --api-issuer "$API_ISSUER_ID"
