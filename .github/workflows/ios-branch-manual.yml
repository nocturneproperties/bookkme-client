name: iOS Manual Distribute

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Distribution environment"
        required: true
        type: choice
        options: [ Dev, Prod ]
        default: Dev
      cache:
        description: "Use latest artifact"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: macos-26
    concurrency:
      group: ios-manual-${{ github.ref }}-${{ inputs.environment }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - name: Set dynamic variables
        run: |
          version_code=$(date +%y%j%H%M)
          clean_ref=${GITHUB_REF#refs/heads/}
          clean_ref=${clean_ref//\//_}
          env_name=${{ inputs.environment }}
          echo "CLEAN_REF=${clean_ref}" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=$version_code" >> $GITHUB_ENV
          echo "ENV_NAME=${env_name,,}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Setup iOS
        uses: ./.github/actions/ios-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-cache-read-only: "false"
          google-service-info: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_FILE }}
          signing-certificate: ${{ secrets.IOS_CERTIFICATE_FILE }}
          signing-certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          provisioning-profile: ${{ secrets.IOS_PROVISIONING_PROFILE_FILE }}

      - name: Download Artifacts
        id: download
        if: inputs.cache
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
          path: ${{ runner.temp }}/export

      - name: Archive
        id: archive
        if: ${{ !inputs.cache || steps.download.outcome != 'success' }}
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme ${{ env.ENV_NAME }} \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            -archivePath ${{ runner.temp }}/BookkMe.xcarchive
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/BookkMe.xcarchive \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath ${{ runner.temp }}/export

      - name: Upload artifact
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.CLEAN_REF }}-${{ env.ENV_NAME }}
          path: ${{ runner.temp }}/export/*.ipa
          overwrite: true
          retention-days: 5

      - name: Distribute
        if: ${{ steps.download.outcome == 'success' || steps.archive.outcome == 'success' }}
        env:
          SERVICE_ACCOUNT: ${{ secrets.ANDROID_SERVICEACC_FILE }}
        run: |
          credentials_path="${{ runner.temp }}/serviceaccount.json"
          echo -n "$SERVICE_ACCOUNT" | base64 --decode > "$credentials_path"
          app_id=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" iosApp/iosApp/GoogleService-Info.plist)
          GOOGLE_APPLICATION_CREDENTIALS="$credentials_path" npx --yes firebase-tools@15.33.0 \
            appdistribution:distribute ${{ runner.temp }}/export/*.ipa --app "$app_id"
