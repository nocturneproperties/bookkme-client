name: iOS Pull Request Verification
on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - 'apps/androidApp/**'
      - 'apps/site/**'
      - 'apps/client/**'
      - 'kotlin-js-store/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ios-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Setup iOS
        uses: ./.github/actions/ios-setup
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          environment: Dev
          google-service-info: ${{ secrets.IOS_DEV_GOOGLE_SERVICE_INFO_FILE }}

      - name: Build
        run: |
          .github/scripts/xcodebuild.sh debug build \
            -project apps/iosApp/iosApp.xcodeproj \
            -scheme dev \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES

      - name: Upload xcodebuild Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/xcodebuild-logs
          if-no-files-found: ignore
          retention-days: 5
