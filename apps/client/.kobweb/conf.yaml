site:
  title: "BookkMe"

server:
  files:
    dev:
      contentRoot: "build/processedResources/js/main/public"
      script: "build/kotlin-webpack/js/developmentExecutable/client.js"
      api: "build/libs/client.jar"
    prod:
      script: "build/kotlin-webpack/js/productionExecutable/client.js"
      siteRoot: ".kobweb/site"
  cors:
    hosts:
      - name: "app.bookkme.com"
        schemes:
          - "https"
      - name: "local-app.bookkme.app"
        schemes:
          - "https"

  port: 8081
